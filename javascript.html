<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>
    nama: <i id="value_nama"></i>
    <br>
    umur: <i id="value_umur"></i>

    <script>
        var nama = "Dinand";

        let umur = 19;

        let tinggi = 170;

        // Array
        let film_favorit = ["Conjouring", "Insidious", "Danur"]

        //console log untuk menampilkan ke jendela console
        console.log("nama: " + nama);
        console.log("umur: " + umur);
        console.log("tinggi: " + tinggi + "cm");
        console.log(film_favorit[0]);

        //Arithmetic Operation
        let a = 22;
        let b = 16.3;

        let jumlah = a + b;
        console.log("hasil akhirnya" + jumlah)

        let kurang = a - b;
        console.log("hasil akhirnya" + kurang)

        let kali = a & b;
        console.log("hasil akhirnya" + kali)

        let bagi = a / b;
        console.log("hasil akhirnya" + bagi)

        let sisa = a % b;
        console.log("hasil akhirnya" + sisa)

        let pangkat = a ** b;
        console.log("hasil akhirnya" + pangkat)

        // conditional statement

        let nilai = 67;

        if (nilai >= 90) {
            console.log("Nilai: A");
        } else if (nilai >= 80) {
            console.log("Nilai: B");
        } else if (nilai >= 70) {
            console.log("Nilai: C");
        } else if (nilai >= 60) {
            console.log("Nilai: D");
        } else if (nilai >= 50) {
            console.log("Nilai: E");
        }

        //Looping
        for (let i = 0; i <= 5; i++) {
            console.log(i);
        }

        //Fungsi
        function penjumlahan (a,b) {
            return console.log ("hasil penjumlahan:" + (a + b));
        }

        //Memanggil fungsi penjumlahan
        penjumlahan(34, 76);

        //menampilkan nama kedalam halaman WEB (DOM)
        document.getElementById("value_nama").innerHTML =nama;
        document.getElementById("value_umur").innerHTML =umur;


    </script>
</body>

</html>
